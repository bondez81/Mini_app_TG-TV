name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # Debug environment
    - name: Debug environment
      run: |
        echo "=== Environment ==="
        echo "Node: $(node --version)"
        echo "npm: $(npm --version)"
        echo "Java: $(java -version 2>&1 | head -1)"
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
        echo ""
        echo "=== Android SDK ==="
        ls -la $ANDROID_HOME/ 2>/dev/null || echo "ANDROID_HOME not found"
        ls -la $ANDROID_HOME/cmdline-tools/ 2>/dev/null || echo "No cmdline-tools"

    # Accept licenses
    - name: Accept Android SDK licenses
      continue-on-error: true
      run: |
        if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        fi

    - name: Install npm dependencies
      run: npm install

    - name: Build web app
      run: npm run build

    - name: Verify build output
      run: |
        echo "=== Build output ==="
        ls -la dist/
        test -f dist/index.html && echo "✅ index.html exists" || echo "❌ index.html missing"

    - name: Remove old android folder
      run: rm -rf android

    - name: Add Capacitor Android platform
      run: |
        echo "=== Adding Android platform ==="
        npx cap add android
        echo "=== Android platform added ==="
        ls -la android/

    - name: Sync Capacitor
      run: |
        echo "=== Syncing Capacitor ==="
        npx cap sync android
        echo "=== Sync complete ==="

    - name: Verify Android project structure
      run: |
        echo "=== Android project structure ==="
        ls -la android/
        ls -la android/app/ 2>/dev/null || echo "No app folder"
        test -f android/gradlew && echo "✅ gradlew exists" || echo "❌ gradlew missing"
        test -f android/app/build.gradle && echo "✅ build.gradle exists" || echo "❌ build.gradle missing"

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Build Debug APK
      if: startsWith(github.ref, 'refs/tags/') == false
      run: |
        echo "=== Building Debug APK ==="
        cd android
        ./gradlew assembleDebug --no-daemon --stacktrace
        echo "=== Build complete ==="

    - name: Build Release APK
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        echo "=== Building Release APK ==="
        cd android
        ./gradlew assembleRelease --no-daemon --stacktrace
        echo "=== Build complete ==="

    - name: Verify APK output
      run: |
        echo "=== Looking for APK files ==="
        find android/app/build -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
        
        if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "✅ Debug APK found!"
          ls -lh android/app/build/outputs/apk/debug/
        elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
          echo "✅ Release APK found!"
          ls -lh android/app/build/outputs/apk/release/
        else
          echo "❌ No APK found!"
          exit 1
        fi

    - name: Upload Debug APK artifact
      if: startsWith(github.ref, 'refs/tags/') == false
      uses: actions/upload-artifact@v5
      with:
        name: TeleTV-Player-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Prepare release APK
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        cp android/app/build/outputs/apk/release/app-release.apk TeleTV-Player-${{ github.ref_name }}.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: TeleTV-Player-${{ github.ref_name }}.apk
        name: TeleTV Player ${{ github.ref_name }}
        body: |
          ## TeleTV Player ${{ github.ref_name }}
          
          ### 📥 Installation
          1. Download the APK file below
          2. Enable "Install from unknown sources" on your Android TV
          3. Install the APK
          
          ### 📱 Requirements
          - Android 8.0+ (API 26)
          - Android TV / Google TV / Fire TV
          
          ### ✨ Features
          - Telegram MTProto integration
          - Video & Audio playback
          - Playlists
          - TV-optimized UI with D-pad navigation
          
          ### 🔧 Setup
          1. Get API credentials from https://my.telegram.org/apps
          2. Open the app and enter your API ID & Hash
          3. Sign in with your phone number
          
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Release APK artifact
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v5
      with:
        name: TeleTV-Player-release
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 90
