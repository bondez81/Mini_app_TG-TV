name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Android SDK is pre-installed on ubuntu-latest runners
    # Just need to accept licenses
    - name: Accept Android SDK licenses
      run: |
        yes | sdkmanager --licenses || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install dependencies
      run: npm ci

    - name: Build web app
      run: npm run build

    - name: Add Capacitor Android platform
      run: npx cap add android

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Build Debug APK
      if: startsWith(github.ref, 'refs/tags/') == false
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon

    - name: Build Release APK
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

    - name: Upload Debug APK artifact
      if: startsWith(github.ref, 'refs/tags/') == false
      uses: actions/upload-artifact@v4
      with:
        name: TeleTV-Player-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Prepare release APK
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        cp android/app/build/outputs/apk/release/app-release.apk TeleTV-Player-${{ github.ref_name }}.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: TeleTV-Player-${{ github.ref_name }}.apk
        name: TeleTV Player ${{ github.ref_name }}
        body: |
          ## TeleTV Player ${{ github.ref_name }}
          
          ### 📥 Installation
          1. Download the APK file below
          2. Enable "Install from unknown sources" on your Android TV
          3. Install the APK
          
          ### 📱 Requirements
          - Android 8.0+ (API 26)
          - Android TV / Google TV / Fire TV
          
          ### ✨ What's new
          - Telegram MTProto integration
          - Video & Audio playback
          - Playlists
          - TV-optimized UI with D-pad navigation
          
          ### 🔧 Setup
          1. Get API credentials from https://my.telegram.org/apps
          2. Open the app and enter your API ID & Hash
          3. Sign in with your phone number
          
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Release APK artifact
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: TeleTV-Player-release
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 90
