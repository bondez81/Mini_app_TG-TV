<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleTV Player - Тест</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .status {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }
        
        .status-item {
            margin: 10px 0;
            font-size: 1.1em;
        }
        
        .success {
            color: #4ade80;
            font-weight: bold;
        }
        
        .info {
            color: #fbbf24;
        }
        
        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        .log {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: left;
            font-family: monospace;
            font-size: 0.9em;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .log-item {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #4ade80;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📺 TeleTV Player</h1>
        
        <div class="status">
            <div class="status-item success">✅ WebView работает!</div>
            <div class="status-item info">JavaScript: <span id="js-status">Проверка...</span></div>
            <div class="status-item info">LocalStorage: <span id="ls-status">Проверка...</span></div>
            <div class="status-item info">Время: <span id="time"></span></div>
        </div>
        
        <div>
            <button onclick="testStorage()">Тест LocalStorage</button>
            <button onclick="loadReactApp()">Загрузить React App</button>
        </div>
        
        <div class="log" id="log">
            <div class="log-item">🚀 Страница загружена</div>
        </div>
    </div>

    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const logItem = document.createElement('div');
            logItem.className = 'log-item';
            logItem.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            logDiv.appendChild(logItem);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }
        
        // Проверка JavaScript
        document.getElementById('js-status').textContent = '✅ Работает';
        log('JavaScript выполнен успешно');
        
        // Проверка LocalStorage
        function testStorage() {
            try {
                localStorage.setItem('test', 'TeleTV Player работает!');
                const value = localStorage.getItem('test');
                document.getElementById('ls-status').textContent = '✅ Работает';
                log('LocalStorage тест: ' + value);
            } catch (e) {
                document.getElementById('ls-status').textContent = '❌ Ошибка: ' + e.message;
                log('LocalStorage ошибка: ' + e.message);
            }
        }
        
        // Автоматическая проверка LocalStorage
        testStorage();
        
        // Обновление времени
        function updateTime() {
            document.getElementById('time').textContent = new Date().toLocaleString('ru-RU');
        }
        updateTime();
        setInterval(updateTime, 1000);
        
        // Загрузка React приложения
        function loadReactApp() {
            log('Загрузка React приложения...');
            window.location.href = '/index.html';
        }
        
        log('Готово к работе!');
    </script>
</body>
</html>
